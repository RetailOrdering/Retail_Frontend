<nav class="navbar" [class.scrolled]="isScrolled">
  <div class="container nav-container">

    <!-- Logo -->
    <a routerLink="/" class="logo">
      <div class="logo-icon">🛍️</div>
      <span class="logo-text">Retail<span>Hub</span></span>
    </a>

    <!-- Navigation Links -->
    <div class="nav-links" [class.open]="mobileMenuOpen">

      <a routerLink="/products" routerLinkActive="active" (click)="closeMobileMenu()">Products</a>

      <!-- Customer only -->
      <a *ngIf="isLoggedIn && userRole !== 'Admin'"
         routerLink="/orders" routerLinkActive="active"
         (click)="closeMobileMenu()">My Orders</a>

      <!-- Admin only -->
      <ng-container *ngIf="isLoggedIn && userRole === 'Admin'">
        <a routerLink="/admin/dashboard" routerLinkActive="active" (click)="closeMobileMenu()">Dashboard</a>
        <a routerLink="/admin/orders"    routerLinkActive="active" (click)="closeMobileMenu()">Manage Orders</a>
        <a routerLink="/admin/products"  routerLinkActive="active" (click)="closeMobileMenu()">Manage Products</a>
      </ng-container>
    </div>

    <!-- Right Actions -->
    <div class="nav-actions">

      <!-- Cart (customers only) -->
      <button *ngIf="isLoggedIn && userRole !== 'Admin'"
              class="cart-btn"
              routerLink="/cart"
              title="View Cart">
        🛒
        <span class="cart-count" *ngIf="cartItemCount > 0">{{ cartItemCount }}</span>
      </button>

      <!-- Logged in: User menu -->
      <div class="user-menu" *ngIf="isLoggedIn; else loginRegister">
        <button class="user-avatar" (click)="toggleUserMenu()" [title]="userName">
          {{ userNameInitial }}
        </button>

        <div class="dropdown" *ngIf="userMenuOpen">
          <div class="dropdown-header">
            <p class="user-name">{{ userName }}</p>
            <p class="user-role">{{ userRole === 'Admin' ? 'Administrator' : 'Customer' }}</p>
          </div>

          <!-- Loyalty Points -->
          <div class="loyalty-points" *ngIf="userRole !== 'Admin'">
            ⭐ Loyalty Points
            <span class="loyalty-badge">{{ loyaltyPoints }}</span>
          </div>

          <button class="dropdown-item danger" (click)="logout()">
            🚪 Logout
          </button>
        </div>
      </div>

      <!-- Not logged in -->
      <ng-template #loginRegister>
        <div class="auth-buttons">
          <button class="btn btn-outline" routerLink="/login">Login</button>
          <button class="btn btn-primary" routerLink="/register">Sign Up</button>
        </div>
      </ng-template>

      <!-- Mobile toggle -->
      <button class="mobile-toggle" [class.open]="mobileMenuOpen" (click)="toggleMobileMenu()">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>

  </div>
</nav>
