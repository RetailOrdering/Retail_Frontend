<nav class="navbar">
  <div class="container nav-container">
    <!-- Logo -->
    <a routerLink="/" class="logo">
      🛍️ <span>RetailHub</span>
    </a>

    <!-- Navigation Links (Dynamic) -->
    <div class="nav-links" [class.open]="mobileMenuOpen">
      <a routerLink="/products" routerLinkActive="active">Products</a>

      <!-- Customer only links -->
      <a *ngIf="isLoggedIn && userRole !== 'Admin'" routerLink="/orders" routerLinkActive="active">My Orders</a>

      <!-- Admin only links -->
      <ng-container *ngIf="isLoggedIn && userRole === 'Admin'">
        <a routerLink="/admin/dashboard" routerLinkActive="active">Dashboard</a>
        <a routerLink="/admin/orders" routerLinkActive="active">Manage Orders</a>
        <a routerLink="/admin/products" routerLinkActive="active">Manage Products</a>
      </ng-container>
    </div>

    <!-- Right side actions -->
    <div class="nav-actions">
      <!-- Cart – visible only for customers (not admin) -->
      <button *ngIf="isLoggedIn && userRole !== 'Admin'" class="cart-btn" routerLink="/cart">
        🛒 <span class="cart-count" *ngIf="cartItemCount > 0">{{ cartItemCount }}</span>
      </button>

      <!-- User Menu (logged in) -->
      <div class="user-menu" *ngIf="isLoggedIn; else loginRegister">
        <button class="user-avatar" (click)="toggleUserMenu()">
          {{ userNameInitial }}
        </button>
        <div class="dropdown" *ngIf="userMenuOpen">
          <p class="user-name">{{ userName }}</p>
          <p class="user-role">{{ userRole === 'Admin' ? 'Administrator' : 'Customer' }}</p>
          <!-- Loyalty Points (only for customers) -->
          <div class="loyalty-points" *ngIf="userRole !== 'Admin'">
            ⭐ <span>{{ loyaltyPoints }}</span> points
          </div>
          <button class="dropdown-item" (click)="logout()">Logout</button>
        </div>
      </div>

      <!-- Login/Register (not logged in) -->
      <ng-template #loginRegister>
        <div class="auth-buttons">
          <button class="btn btn-outline" routerLink="/login">Login</button>
          <button class="btn btn-primary" routerLink="/register">Sign Up</button>
        </div>
      </ng-template>

      <!-- Mobile menu toggle -->
      <button class="mobile-toggle" (click)="toggleMobileMenu()">☰</button>
    </div>
  </div>
</nav>
