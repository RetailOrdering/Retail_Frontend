<div class="card h-100 shadow-sm">
  <div class="card-body d-flex flex-column">
    <h5 class="card-title">{{ product.name }}</h5>
    <p class="card-text text-muted small">{{ product.brand }} • {{ product.packaging }}</p>
    <p class="card-text">{{ product.description | slice:0:80 }}...</p>
    <div class="mt-auto">
      <div class="h6 text-primary fw-bold mb-2">{{ product.price | currency:'INR' }}</div>
      <button class="btn btn-primary w-100" (click)="addToCart()" [disabled]="addingToCart">
        <span *ngIf="!addingToCart"><i class="bi bi-cart-plus me-1"></i> Add to Cart</span>
        <span *ngIf="addingToCart"><span class="spinner-border spinner-border-sm me-1"></span> Adding...</span>
      </button>
    </div>
  </div>
</div>
