<div class="product-card" (click)="navigateToDetail()">
  <div class="image-wrapper">
    <div class="image-placeholder">
      <span>{{ product.name.charAt(0) }}</span>
    </div>
    <span *ngIf="product.stock === 0" class="stock-badge out-of-stock">Out of Stock</span>
    <span *ngIf="product.stock > 0 && product.stock <= 5" class="stock-badge low-stock">⚠️ Only {{ product.stock }} left</span>
    <span *ngIf="!product.isAvailable" class="stock-badge unavailable">Unavailable</span>
  </div>
  <div class="card-body">
    <h3 class="product-title">{{ product.name }}</h3>
    <p class="product-brand" *ngIf="product.brand">{{ product.brand }}</p>
    <p class="product-price">₹{{ product.price | number:'1.2-2' }}</p>
    <button 
      class="btn btn-primary add-to-cart" 
      (click)="addToCart($event)"
      [disabled]="product.stock === 0 || !product.isAvailable">
      🛒 Add to Cart
    </button>
  </div>
</div>
