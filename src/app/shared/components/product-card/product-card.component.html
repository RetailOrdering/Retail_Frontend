<div class="card h-100 shadow-sm">
  <img [src]="product.imageUrl || 'assets/placeholder.png'" class="card-img-top" [alt]="product.name">
  <div class="card-body d-flex flex-column">
    <h5 class="card-title">{{product.name}}</h5>
    <p class="card-text">{{product.description | slice:0:80}}...</p>
    <div class="mt-auto">
      <div class="h5 text-primary fw-bold mb-2">{{product.price | currency}}</div>
      <button class="btn btn-primary w-100" (click)="addToCart()">
        <i class="bi bi-cart-plus"></i> Add to Cart
      </button>
    </div>
  </div>
</div>
