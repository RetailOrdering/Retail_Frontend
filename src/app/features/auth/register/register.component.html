<div class="auth-page">
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <h1>Create Account</h1>
        <p>Join us and start shopping</p>
      </div>

      <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" formControlName="name" placeholder="John Doe">
          <span class="error" *ngIf="registerForm.get('name')?.invalid && registerForm.get('name')?.touched">
            Name is required (min 2 characters)
          </span>
        </div>

        <div class="form-group">
          <label>Email</label>
          <input type="email" formControlName="email" placeholder="you@example.com">
          <span class="error" *ngIf="registerForm.get('email')?.invalid && registerForm.get('email')?.touched">
            Valid email is required
          </span>
        </div>

        <div class="form-group">
          <label>Password</label>
          <input type="password" formControlName="password" placeholder="••••••">
          <span class="error" *ngIf="registerForm.get('password')?.invalid && registerForm.get('password')?.touched">
            Password must be at least 6 characters
          </span>
        </div>

        <div class="form-group">
          <label>Confirm Password</label>
          <input type="password" formControlName="confirmPassword" placeholder="••••••">
          <span class="error" *ngIf="registerForm.hasError('mismatch') && registerForm.get('confirmPassword')?.touched">
            Passwords do not match
          </span>
        </div>

        <div class="error-message" *ngIf="error">{{ error }}</div>

        <button type="submit" class="btn btn-primary" [disabled]="loading">
          {{ loading ? 'Creating account...' : 'Sign Up' }}
        </button>
      </form>

      <div class="auth-footer">
        Already have an account? <a routerLink="/login">Sign in</a>
      </div>
    </div>
  </div>
</div>
