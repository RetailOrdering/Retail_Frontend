<div class="container d-flex align-items-center justify-content-center" style="min-height: 70vh;">
  <div class="card shadow-sm border-0" style="max-width: 420px; width: 100%;">
    <div class="card-body p-4">
      <h3 class="text-center fw-bold mb-1">Welcome back</h3>
      <p class="text-center text-muted small mb-4">Sign in to your account</p>
      <form #loginForm="ngForm" (ngSubmit)="onSubmit()">
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input type="email" class="form-control" [(ngModel)]="email" name="email" required autofocus>
        </div>
        <div class="mb-4">
          <label class="form-label">Password</label>
          <input type="password" class="form-control" [(ngModel)]="password" name="password" required>
        </div>
        <button type="submit" class="btn btn-primary w-100 py-2" [disabled]="loading">
          {{ loading ? 'Logging in...' : 'Login' }}
        </button>
      </form>
      <div class="text-center mt-4">
        <small class="text-muted">Don't have an account? <a routerLink="/register" class="text-decoration-none fw-medium">Register</a></small>
      </div>
    </div>
  </div>
</div>
