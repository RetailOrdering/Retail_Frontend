<div class="container my-4">
  <h2>Shopping Cart</h2>
  <div *ngIf="(cartItems$ | async)?.length === 0" class="alert alert-info">
    Your cart is empty. <a routerLink="/products">Continue shopping</a>
  </div>
  <div *ngIf="(cartItems$ | async)?.length! > 0">
    <div class="table-responsive">
      <table class="table table-bordered align-middle">
        <thead class="table-dark">
          <tr>
            <th>Product</th>
            <th>Price</th>
            <th>Quantity</th>
            <th>Total</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let item of cartItems$ | async">
            <td>{{item.productName}}</td>
            <td>{{item.price | currency}}</td>
            <td>
              <input type="number" class="form-control form-control-sm" style="width: 80px;" [(ngModel)]="item.quantity" (change)="updateQuantity(item.productId, item.quantity)" min="1">
            </td>
            <td>{{item.price * item.quantity | currency}}</td>
            <td>
              <button class="btn btn-danger btn-sm" (click)="removeItem(item.productId)">Remove</button>
            </td>
          </tr>
        </tbody>
        <tfoot class="table-light">
          <tr>
            <th colspan="3" class="text-end">Total:</th>
            <th>{{getTotal() | currency}}</th>
            <th></th>
          </tr>
        </tfoot>
      </table>
    </div>
    <div class="d-flex justify-content-between">
      <button class="btn btn-secondary" routerLink="/products">Continue Shopping</button>
      <button class="btn btn-success" routerLink="/checkout">Proceed to Checkout</button>
    </div>
  </div>
</div>
