<div class="container my-4">
  <h2 class="mb-4">Our Products</h2>
  <div *ngIf="(products$ | async)?.length === 0" class="alert alert-info text-center">
    No products available at the moment.
  </div>
  <div class="row g-4">
    <div class="col-12 col-sm-6 col-md-4 col-lg-3" *ngFor="let product of products$ | async">
      <app-product-card [product]="product"></app-product-card>
    </div>
  </div>
</div>
