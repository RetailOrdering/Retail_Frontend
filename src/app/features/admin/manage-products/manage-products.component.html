<div class="manage-page">
  <div class="container">
    <div class="page-header">
      <h1>Manage Products</h1>
      <button class="btn btn-primary" (click)="openAddModal()">+ Add Product</button>
    </div>

    <div *ngIf="loading" class="loader-wrapper"><div class="loader"></div><p>Loading products...</p></div>
    <div *ngIf="error" class="error-message">{{ error }} <button class="btn btn-outline" (click)="loadProducts()">Retry</button></div>

    <div *ngIf="!loading && !error && products.length === 0" class="empty-state">No products found.</div>

    <div *ngIf="!loading && !error && products.length > 0" class="table-responsive">
      <table class="data-table">
        <thead>
          <tr><th>ID</th><th>Name</th><th>Price</th><th>Stock</th><th>Available</th><th>Actions</th></tr>
        </thead>
        <tbody>
          <tr *ngFor="let product of products">
            <td>{{ product.id }}</td>
            <td>{{ product.name }}</td>
            <td>₹{{ product.price | number:'1.2-2' }}</td>
            <td>{{ product.stock }}</td>
            <td><span class="badge" [class.badge-success]="product.isAvailable" [class.badge-danger]="!product.isAvailable">{{ product.isAvailable ? 'Yes' : 'No' }}</span></td>
            <td>
              <button class="btn-icon edit" (click)="openEditModal(product)">✏️</button>
              <button class="btn-icon delete" (click)="deleteProduct(product.id)">🗑️</button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
