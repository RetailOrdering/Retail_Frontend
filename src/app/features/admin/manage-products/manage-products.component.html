<div class="container-fluid">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Manage Products</h2>
    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#productModal" (click)="openModal()">
      + Add Product
    </button>
  </div>

  <div *ngIf="loading" class="text-center py-5">
    <div class="spinner-border text-primary"></div>
  </div>

  <div class="table-responsive" *ngIf="!loading">
    <table class="table table-striped table-hover">
      <thead class="table-dark">
        <tr>
          <th>ID</th>
          <th>Name</th>
          <th>Brand</th>
          <th>Price</th>
          <th>Stock</th>
          <th>Status</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let product of products">
          <td>{{ product.id }}</td>
          <td>{{ product.name }}</td>
          <td>{{ product.brand }}</td>
          <td>{{ product.price | currency:'INR' }}</td>
          <td>{{ product.stock }}</td>
          <td>
            <span class="badge" [ngClass]="product.isAvailable ? 'bg-success' : 'bg-danger'">
              {{ product.isAvailable ? 'Available' : 'Unavailable' }}
            </span>
          </td>
          <td>
            <button class="btn btn-sm btn-outline-primary me-1" (click)="editProduct(product)">Edit</button>
            <button class="btn btn-sm btn-outline-danger" (click)="deleteProduct(product.id)">Delete</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<!-- Bootstrap Modal for Add/Edit Product -->
<div class="modal fade" id="productModal" tabindex="-1" data-bs-backdrop="static">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">{{ isEditMode ? 'Edit Product' : 'Add Product' }}</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <form #productForm="ngForm">
          <div class="mb-2">
            <label>Name</label>
            <input type="text" class="form-control" [(ngModel)]="formData.name" name="name" required>
          </div>
          <div class="mb-2">
            <label>Description</label>
            <textarea class="form-control" [(ngModel)]="formData.description" name="description" rows="2"></textarea>
          </div>
          <div class="mb-2">
            <label>Price (₹)</label>
            <input type="number" class="form-control" [(ngModel)]="formData.price" name="price" required>
          </div>
          <div class="mb-2">
            <label>Packaging</label>
            <input type="text" class="form-control" [(ngModel)]="formData.packaging" name="packaging">
          </div>
          <div class="mb-2">
            <label>Brand</label>
            <input type="text" class="form-control" [(ngModel)]="formData.brand" name="brand">
          </div>
          <div class="mb-2">
            <label>Category ID</label>
            <input type="number" class="form-control" [(ngModel)]="formData.categoryId" name="categoryId" required>
          </div>
          <div class="mb-2">
            <label>Stock</label>
            <input type="number" class="form-control" [(ngModel)]="formData.stock" name="stock" required>
          </div>
          <div class="form-check">
            <input class="form-check-input" type="checkbox" [(ngModel)]="formData.isAvailable" name="isAvailable">
            <label class="form-check-label">Available</label>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-primary" (click)="saveProduct()" [disabled]="productForm.invalid">Save</button>
      </div>
    </div>
  </div>
</div>
