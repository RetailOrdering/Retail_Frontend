<div class="container-fluid">
  <h1 class="h2 mb-4">Admin Dashboard</h1>
  <div class="row g-4">
    <div class="col-md-3">
      <div class="card text-center p-3 shadow-sm">
        <i class="bi bi-box-seam fs-1 text-primary"></i>
        <h3 class="mt-2">{{ totalProducts }}</h3>
        <p class="text-muted">Total Products</p>
      </div>
    </div>
    <div class="col-md-3">
      <div class="card text-center p-3 shadow-sm">
        <i class="bi bi-cart-check fs-1 text-success"></i>
        <h3 class="mt-2">{{ totalOrders }}</h3>
        <p class="text-muted">Total Orders</p>
      </div>
    </div>
    <div class="col-md-3">
      <div class="card text-center p-3 shadow-sm">
        <i class="bi bi-people fs-1 text-info"></i>
        <h3 class="mt-2">{{ totalUsers }}</h3>
        <p class="text-muted">Total Users</p>
      </div>
    </div>
    <div class="col-md-3">
      <div class="card text-center p-3 shadow-sm">
        <i class="bi bi-exclamation-triangle fs-1 text-warning"></i>
        <h3 class="mt-2">{{ lowStockCount }}</h3>
        <p class="text-muted">Low Stock (<10)</p>
      </div>
    </div>
  </div>
  <div class="mt-4">
    <a routerLink="/admin/products" class="btn btn-outline-primary me-2">Manage Products</a>
    <a routerLink="/admin/orders" class="btn btn-outline-secondary">Manage Orders</a>
  </div>
</div>
