<div class="manage-orders">
  <div class="container">
    <h1>Manage Orders</h1>
    <div *ngIf="loading" class="loader-wrapper"><div class="loader"></div></div>
    <div *ngIf="error" class="error-message">{{ error }}</div>
    <div *ngIf="!loading && !error">
      <table class="data-table">
        <thead><tr><th>Order ID</th><th>User ID</th><th>Date</th><th>Total</th><th>Status</th><th>Action</th></tr></thead>
        <tbody>
          <tr *ngFor="let order of orders">
            <td>{{ order.id }}</td><td>{{ order.userId }}</td><td>{{ order.createdAt | date:'short' }}</td><td>₹{{ order.totalAmount }}</td>
            <td><span class="badge" [class]="getStatusClass(order.status)">{{ order.status }}</span></td>
            <td>
              <select [(ngModel)]="order.status" (change)="updateStatus(order.id, order.status)">
                <option *ngFor="let s of statusOptions" [value]="s">{{ s }}</option>
              </select>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
